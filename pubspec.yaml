name: flutter_iptv
description: A professional IPTV player application supporting Windows, Android Mobile, and Android TV with D-Pad navigation.
publish_to: 'none'
version: 1.6.4+188

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Video Player（自建 fork：Dart 构建钩子自带 libmpv，AVS3 + 去交错；两个包必须同一 ref）
  media_kit:
    git:
      url: https://github.com/KLGIT886/media-kit.git
      ref: 189d61147fefb7cf9e32e98a477c2cdc90a0edfd
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/KLGIT886/media-kit.git
      ref: 189d61147fefb7cf9e32e98a477c2cdc90a0edfd
      path: ./media_kit_video
  
  # Local Storage
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2
  path_provider: ^2.1.6
  path: ^1.8.3
  file_picker: ^13.1.0
  ffi: ^2.1.0
  
  # HTTP & Network
  http: ^1.1.2
  dio: ^5.11.0
  
  # Update Service
  version: ^3.0.2
  package_info_plus: ^10.2.1
  url_launcher: ^6.2.2
  
  # UI Components
  cached_network_image: ^4.0.0
  flutter_cache_manager: ^3.4.2
  shimmer: ^4.0.0
  flutter_staggered_animations: ^1.1.1
  qr_flutter: ^4.1.0
  
  # Utilities
  intl: ^0.20.2
  xml: ^7.0.1
  
  # Backup & Restore
  archive: ^4.0.9
  restart_app: ^1.8.3
  
  # Logging
  logger: ^2.7.0
  
  # Window Management (Windows)
  window_manager: ^0.7.0
  collection: ^1.18.0
  uuid: ^4.6.0
  
  # Icons
  cupertino_icons: ^2.0.0
  material_design_icons_flutter: ^7.0.7296
  screen_brightness: ^2.1.11
  wakelock_plus: ^1.8.2
  screen_retriever: ^0.4.0
  device_info_plus: ^13.2.0
  material_ui: ^1.1.0
  cupertino_ui: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4



flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
    - assets/html/
    - assets/sql/

  fonts:
    # 中文字体
    - family: SimHei
      fonts:
        - asset: assets/fonts/SimHei.ttf
    - family: SimSun
      fonts:
        - asset: assets/fonts/SimSun.ttc
    - family: KaiTi
      fonts:
        - asset: assets/fonts/KaiTi.ttf
    - family: FangSong
      fonts:
        - asset: assets/fonts/FangSong.ttf
    - family: MicrosoftYaHei
      fonts:
        - asset: assets/fonts/MicrosoftYaHei.ttc
    # 英文字体
    - family: Arial
      fonts:
        - asset: assets/fonts/Arial.ttf
    - family: Calibri
      fonts:
        - asset: assets/fonts/Calibri.ttf
    - family: Georgia
      fonts:
        - asset: assets/fonts/Georgia.ttf
    - family: Verdana
      fonts:
        - asset: assets/fonts/Verdana.ttf
    - family: Tahoma
      fonts:
        - asset: assets/fonts/Tahoma.ttf
    - family: TimesNewRoman
      fonts:
        - asset: assets/fonts/TimesNewRoman.ttf
    - family: SegoeUI
      fonts:
        - asset: assets/fonts/SegoeUI.ttf
    - family: Impact
      fonts:
        - asset: assets/fonts/Impact.ttf
